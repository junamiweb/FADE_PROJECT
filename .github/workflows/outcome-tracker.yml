name: FADE outcome tracker

# רץ כל שעה, 5 דקות אחרי שכל bar שעתי נסגר ב-Binance, כדי לתפוס אותו בהקדם.
# אפשר גם להריץ ידנית מה-Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

# נדרש כדי שה-Action יוכל לעשות git push בחזרה ל-repo (commit של CSVs/JSONL מעודכנים).
permissions:
  contents: write

jobs:
  refresh-and-track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh historical data (BTC + ETH, incremental)
        run: python download_history.py refresh

      # אם/כשקורסור מוסיף תמיכה במספר נכסים (SOL/BNB/XRP וכו') כפי שביקשנו,
      # יש להוסיף כאן שורת refresh נוספת לכל נכס, למשל:
      # run: python download_history.py asset sol 1h
      # לפני שמוסיפים - לוודא שה-asset מוגדר גם ב-pre_registration.json.

      - name: Run outcome tracker — sparse PRIMARY + ETH candidate (log + score + report)
        run: |
          set -e
          python -m fade.pipeline.ultra_next_bar refine
          python -m fade.pipeline.outcome_tracker run-all
        # run-all includes PRIMARY + ETH candidate + ULTRA. Re-run after fixes — schedule uses commit at trigger.

      - name: Forward validation snapshot (Track A / ETH / E progress)
        run: python -m fade.pipeline.forward_validation_snapshot

      # Optional — module may be absent on some branches; never block ULTRA/ledger commits.
      - name: Council forward digest (optional)
        continue-on-error: true
        run: |
          if [ -f fade/pipeline/council_session.py ]; then
            python -m fade.pipeline.council_session forward-digest
          else
            echo "council_session.py not on this branch — skip"
          fi

      - name: Report ETH candidate
        run: python -m fade.pipeline.outcome_tracker report-candidate

      - name: Commit and push updated data/ledgers
        run: |
          git config user.name "fade-bot"
          git config user.email "fade-bot@users.noreply.github.com"
          # refresh מעדכן 5m/15m/30m/1h — sparse PRIMARY צריך multi-res; state.json שומר min_hold
          git add btc_*.csv eth_*.csv fade/output/*.jsonl fade/output/eth_candidate_state.json fade/output/forward_validation_snapshot.json fade/output/ultra_next_bar_holdout.json fade/output/ultra_active_rule.json fade/output/ultra_rule_search.json fade/output/ultra_rule_search_1h.json fade/output/ultra_lockbox_eval.json fade/output/ultra_refinement_log.jsonl fade/output/council_digest.json fade/output/council_board.json || true
          git diff --cached --quiet || git commit -m "auto: refresh + outcome tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
